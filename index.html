<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swara Sense</title>
<meta name="description" content="Swara Sense: a free Carnatic ear-training game. Spot swaras, name ragas and catch melodic changes, ten questions at a time.">
<meta name="theme-color" content="#5B0E22">
<meta property="og:title" content="Swara Sense: Carnatic ear training">
<meta property="og:description" content="Spot swaras, name ragas and catch melodic changes. Free, in your browser.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;500;600;700&family=Gloock&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6ECEC; --surface:#FFFFFF; --ink:#3A0A16; --muted:#7A4E57; --line:#E8D3D6;
  --hero:#5B0E22; --hero-ink:#FBEFE6; --hero-muted:#E2B9B0;
  --zari:#B8860B; --zari-bright:#E9BE4C; --zari-soft:#F7E8C3;
  --good:#2F7D4F; --good-soft:#DCEFE2; --bad:#B42318; --bad-soft:#FBE1DE;
  --display:"Gloock", "Didot", Georgia, serif;
  --body:"Anek Tamil", "Segoe UI", system-ui, -apple-system, sans-serif;
  --bw:9%;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#22050D; --surface:#330A17; --ink:#F8E9E4; --muted:#C9A3AA; --line:#52202E;
    --hero:#45091A; --zari:#E6B84A; --zari-soft:#4A3414;
    --good:#7CC495; --good-soft:#183A26; --bad:#F08A7E; --bad-soft:#4A1A18;
  }
}
:root[data-theme="dark"]{
  --bg:#22050D; --surface:#330A17; --ink:#F8E9E4; --muted:#C9A3AA; --line:#52202E;
  --hero:#45091A; --zari:#E6B84A; --zari-soft:#4A3414;
  --good:#7CC495; --good-soft:#183A26; --bad:#F08A7E; --bad-soft:#4A1A18;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top, 0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--zari-bright);outline-offset:2px;border-radius:8px}

/* Masthead: a silk panel with a zari border */
.hero{background:var(--hero);color:var(--hero-ink);text-align:center;position:relative;padding:34px 20px 40px}
.zari{height:16px;background:
  linear-gradient(135deg, var(--zari-bright) 25%, transparent 25%) -8px 0/16px 16px,
  linear-gradient(225deg, var(--zari-bright) 25%, transparent 25%) -8px 0/16px 16px;
  border-top:3px solid var(--zari-bright);}
.hero .ta{font-weight:500;color:var(--zari-bright);font-size:1.05rem;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.8rem,11vw,4.6rem);line-height:1;margin:6px 0 10px}
.hero .tag{margin:0 auto;color:var(--hero-muted);max-width:36ch}
.stats{display:inline-flex;gap:0;margin-top:22px;border:1px solid rgba(233,190,76,.45);border-radius:999px;overflow:hidden}
.stat{padding:6px 18px;display:flex;align-items:baseline;gap:8px}
.stat + .stat{border-left:1px solid rgba(233,190,76,.45)}
.stat b{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1;color:var(--zari-bright)}
.stat small{color:var(--hero-muted);font-size:.85rem}

.wrap{max-width:680px;margin:0 auto;padding:26px 18px 40px}

/* Mode and level */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;font-weight:600;font-size:.95rem;line-height:1.2;color:var(--muted)}
.modes button[aria-selected="true"]{border-color:var(--zari);color:var(--ink);background:var(--zari-soft)}
.level{display:flex;justify-content:center;gap:18px;margin:14px 0 22px}
.level button{background:none;border:0;padding:2px 2px 4px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.level button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--zari)}

/* Question */
.stage{text-align:center}
.progress{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.progress i{width:10px;height:10px;transform:rotate(45deg);background:var(--line);border-radius:2px}
.progress i.ok{background:var(--good)}
.progress i.no{background:var(--bad)}
.progress i.now{background:var(--zari);box-shadow:0 0 0 3px var(--zari-soft)}
.qcount{color:var(--muted);font-size:.9rem;margin:0}
.prompt{font-family:var(--display);font-size:clamp(1.25rem,4.6vw,1.6rem);line-height:1.3;margin:6px auto 22px;max-width:28ch}

.playrow{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:24px}
.play{width:92px;height:92px;border-radius:50%;border:0;background:var(--hero);color:var(--zari-bright);display:grid;place-items:center;
  box-shadow:0 0 0 4px var(--bg), 0 0 0 6px var(--zari);transition:transform .12s}
.play:active{transform:scale(.95)}
.play svg{width:34px;height:34px;margin-left:5px}
.play.replay svg{margin-left:0}
.listen{display:flex;gap:4px;align-items:flex-end;height:22px}
.listen span{width:4px;height:4px;border-radius:2px;background:var(--zari);transition:height .2s}
.listen.on span{animation:bounce .8s ease-in-out infinite}
.listen.on span:nth-child(2){animation-delay:.12s}
.listen.on span:nth-child(3){animation-delay:.24s}
.listen.on span:nth-child(4){animation-delay:.36s}
@keyframes bounce{50%{height:20px}}
.playhint{color:var(--muted);font-size:.9rem}
.ghost{background:none;border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:500}
.ghost:hover{border-color:var(--zari)}

.options{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.opt{flex:0 1 auto;min-width:96px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:9px 20px 8px;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--zari)}
.opt:disabled{cursor:default}
.opt.locked{opacity:.4}
.opt b{display:block;font-size:1.1rem;font-weight:700;line-height:1.15}
.opt small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.opt.correct{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}

.feedback{margin:24px auto 0;max-width:520px;text-align:left;background:var(--surface);border-left:4px solid var(--zari);border-radius:4px 14px 14px 4px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.feedback p{margin:0}
.feedback .verdict{font-weight:700}
.feedback .verdict.ok{color:var(--good)}
.feedback .verdict.no{color:var(--bad)}
.primary{align-self:flex-start;background:var(--hero);color:var(--hero-ink);border:0;border-radius:999px;padding:10px 22px;font-weight:600}

.done h2{font-family:var(--display);font-weight:400;font-size:2.6rem;margin:8px 0 6px;line-height:1.1}
.done p{margin:0 0 4px;color:var(--muted)}
.done .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.done .primary{align-self:auto}

/* Keyboard */
.board{margin-top:34px}
.board h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.board .hint{color:var(--muted);font-size:.9rem;margin:2px 0 12px}
.keys{position:relative;display:flex;height:170px;background:var(--hero);padding:10px 8px 8px;border-radius:14px;border-top:6px solid var(--zari)}
.key{border:0;padding:0 0 10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;transition:background .15s, box-shadow .15s}
.key.white{flex:1;background:#FBF6F1;color:#3A0A16;border-radius:0 0 8px 8px;margin:0 2px;box-shadow:inset 0 -6px 0 #E6DCD3}
.key.black{position:absolute;top:10px;width:calc((100% - 16px) * 0.09);height:58%;background:#1C0A0F;color:#F1D9A0;border-radius:0 0 6px 6px;z-index:2;box-shadow:inset 0 -5px 0 #3A1A22;padding-bottom:8px}
.key .l{font-weight:700;font-size:.95rem;line-height:1}
.key .t{font-size:.72rem;opacity:.7;line-height:1}
.key.black .l{font-size:.8rem}
.key.white.lit,.key.white.flash{background:var(--zari-bright);box-shadow:inset 0 -6px 0 #B8860B}
.key.black.lit,.key.black.flash{background:#8A6312;color:#FFF3D0;box-shadow:inset 0 -5px 0 #5E420B, 0 0 14px rgba(233,190,76,.7)}

.controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.95rem}
.controls .ghost{color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.controls .ghost i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.controls .ghost[aria-pressed="true"]{border-color:var(--zari)}
.controls .ghost[aria-pressed="true"] i{background:var(--zari)}
.controls label{display:flex;gap:8px;align-items:center}
select{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px}
.foot{margin-top:24px;color:var(--muted);font-size:.85rem;text-align:center}

@media (max-width:480px){
  .modes button{font-size:.85rem;padding:10px 4px}
  .keys{height:150px}
  .key .l{font-size:.85rem}
  .key.black .l{font-size:.7rem}
  .key .t{display:none}
}
@media (prefers-reduced-motion: reduce){
  .listen.on span{animation:none;height:12px}
  .play,.opt,.key{transition:none}
}
</style>
</head>
<body>
<header class="hero">
  <p class="ta">ஸ்வர உணர்வு</p>
  <h1>Swara Sense</h1>
  <p class="tag">Train your ear for Carnatic music, ten questions at a time.</p>
  <div class="stats" aria-live="polite">
    <div class="stat"><b id="score">0</b><small>points</small></div>
    <div class="stat"><b id="streak">0</b><small>streak</small></div>
  </div>
</header>
<div class="zari" aria-hidden="true"></div>

<main class="wrap">
  <div class="modes" role="tablist" aria-label="Game mode">
    <button role="tab" data-mode="swara" aria-selected="true">Spot the swara</button>
    <button role="tab" data-mode="raga" aria-selected="false">Name the raga</button>
    <button role="tab" data-mode="change" aria-selected="false">Spot the change</button>
  </div>
  <div class="level" role="group" aria-label="Level">
    <button data-level="beginner" aria-pressed="true">Beginner</button>
    <button data-level="advanced" aria-pressed="false">Advanced</button>
  </div>

  <section class="stage" id="stage" aria-live="polite"></section>

  <section class="board" aria-label="Keyboard">
    <h3>The keyboard</h3>
    <p class="hint">Sa is the first key. Tap any key to hear it; after each answer, the notes involved light up.</p>
    <div class="keys" id="keys"></div>
  </section>

  <div class="controls">
    <button class="ghost" id="drone" aria-pressed="false"><i></i><span>Drone off</span></button>
    <label for="sruti">Sruti
      <select id="sruti"></select>
    </label>
    <button class="ghost" id="restart">Restart round</button>
  </div>
  <p class="foot">Turn on the drone so every note has a Sa underneath it. Space plays, Enter moves on.</p>
</main>

<script>

(function(){
"use strict";

/* ---------- Music data ---------- */
var SW = {
  S:{id:"S",  r:1,     name:"Shadjam",               ta:"ஸ",  desc:"the tonic, home base for every raga."},
  R1:{id:"R1",r:16/15, name:"Shuddha Rishabham",     ta:"ரி", desc:"only a half step above Sa. Tense and devotional, heard in Mayamalavagowla."},
  R2:{id:"R2",r:9/8,   name:"Chatushruti Rishabham", ta:"ரி", desc:"a whole step above Sa. Open and steady, the Ri of Shankarabharanam."},
  G2:{id:"G2",r:6/5,   name:"Sadharana Gandharam",   ta:"க",  desc:"a minor third above Sa. Soft and wistful, as in Kharaharapriya."},
  G3:{id:"G3",r:5/4,   name:"Antara Gandharam",      ta:"க",  desc:"a major third above Sa. Bright and confident, as in Mohanam."},
  M1:{id:"M1",r:4/3,   name:"Shuddha Madhyamam",     ta:"ம",  desc:"a perfect fourth. Grounded, it feels like a resting point."},
  M2:{id:"M2",r:45/32, name:"Prati Madhyamam",       ta:"ம",  desc:"a raised fourth. Restless and luminous, the signature of Kalyani."},
  P:{id:"P",  r:3/2,   name:"Panchamam",             ta:"ப",  desc:"a perfect fifth. The tanpura's partner note, and it never changes."},
  D1:{id:"D1",r:8/5,   name:"Shuddha Dhaivatam",     ta:"த",  desc:"a minor sixth, just above Pa. Heavy and plaintive."},
  D2:{id:"D2",r:5/3,   name:"Chatushruti Dhaivatam", ta:"த",  desc:"a major sixth. Sweet and open, as in Mohanam."},
  N2:{id:"N2",r:9/5,   name:"Kaisiki Nishadham",     ta:"நி", desc:"a minor seventh. Relaxed and folk-like, as in Kharaharapriya."},
  N3:{id:"N3",r:15/8,  name:"Kakali Nishadham",      ta:"நி", desc:"a half step below the upper Sa. It pulls strongly back home."},
  S2:{id:"S2",r:2,     name:"Tara Shadjam",          ta:"ஸ",  desc:"Sa an octave higher."}
};
var FRETS = ["S","R1","R2","G2","G3","M1","M2","P","D1","D2","N2","N3","S2"];
function label(id){ return id === "S2" ? "Ṡ" : id; }

var RAGAS = [
  {n:"Mayamalavagowla", s:["S","R1","G3","M1","P","D1","N3"], b:true,  d:"Melakarta 15, and the first raga most students learn. The half steps around Sa and Pa (R1, D1 and N3) give it a solemn, devotional colour."},
  {n:"Shankarabharanam",s:["S","R2","G3","M1","P","D2","N3"], b:true,  d:"Melakarta 29, with the same notes as the Western major scale. Bright and stately."},
  {n:"Kalyani",         s:["S","R2","G3","M2","P","D2","N3"], b:true,  d:"Melakarta 65. Like Shankarabharanam but with the raised M2, which gives it a lifted, glowing feel."},
  {n:"Kharaharapriya",  s:["S","R2","G2","M1","P","D2","N2"], b:true,  d:"Melakarta 22. The soft G2 and N2 make it warm and reflective, close to the Dorian mode."},
  {n:"Mohanam",         s:["S","R2","G3","P","D2"],           b:true,  d:"A five-note raga with no Ma or Ni. Open and joyful, like the major pentatonic."},
  {n:"Hamsadhwani",     s:["S","R2","G3","P","N3"],           b:true,  d:"Five notes, skipping Ma and Dha. Bright and celebratory, a favourite for opening a concert."},
  {n:"Hindolam",        s:["S","G2","M1","D1","N2"],          b:true,  d:"Five notes with no Ri or Pa. Deep and meditative."},
  {n:"Harikambhoji",    s:["S","R2","G3","M1","P","D2","N2"], b:false, d:"Melakarta 28. Shankarabharanam with a softer N2, close to the Mixolydian mode."},
  {n:"Natabhairavi",    s:["S","R2","G2","M1","P","D1","N2"], b:false, d:"Melakarta 20, matching the natural minor scale. Earnest and plaintive."},
  {n:"Hanumatodi",      s:["S","R1","G2","M1","P","D1","N2"], b:false, d:"Melakarta 8, known as Todi. Flat R1, G2, D1 and N2 make it dark and intense. In concert it carries heavy gamakas a plain scale cannot show."},
  {n:"Charukesi",       s:["S","R2","G3","M1","P","D1","N2"], b:false, d:"Melakarta 26. A bright lower half and a sad upper half. Poignant and cinematic."},
  {n:"Madhyamavati",    s:["S","R2","M1","P","N2"],           b:false, d:"Five notes, skipping Ga and Dha. Auspicious, and often sung to close a concert."},
  {n:"Shivaranjani",    s:["S","R2","G2","P","D2"],           b:false, d:"Five notes with a minor third. Full of longing."},
  {n:"Abhogi",          s:["S","R2","G2","M1","D2"],          b:false, d:"Five notes with no Pa. Gentle and graceful."},
  {n:"Revati",          s:["S","R1","M1","P","N2"],           b:false, d:"Five notes with R1 and N2. Spare and haunting, with a chant-like quality."},
  {n:"Shuddha Saveri",  s:["S","R2","M1","P","D2"],           b:false, d:"Five notes, skipping Ga and Ni. Calm and stable."}
];

var SRUTIS = [["C",0],["C#",1],["D",2],["D#",3],["E",4],["F",5],["F#",6],["G",7],["G#",8],["A",9]];
var MODE_NAMES = {swara:"Spot the swara", raga:"Name the raga", change:"Spot the change"};
var ROUND = 10;

/* ---------- Audio: synthesised piano with long sustain ---------- */
var ctx = null, master = null, droneGain = null, bus = null, sruti = 1;
var droneOn = false, droneTimer = null, droneNext = 0, droneStep = 0;
var PW = null, NOISE = null;

function sa(){ return 261.63 * Math.pow(2, sruti / 12); }

function makeReverb(){
  var len = Math.floor(ctx.sampleRate * 2.6), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for(var c = 0; c < 2; c++){
    var d = ir.getChannelData(c);
    for(var i = 0; i < len; i++){ d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  }
  var conv = ctx.createConvolver(); conv.buffer = ir; return conv;
}

function audio(){
  if(!ctx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    ctx = new AC();
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.005; comp.release.value = 0.25;
    var out = ctx.createGain(); out.gain.value = 0.9;
    comp.connect(out); out.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 1;
    var dry = ctx.createGain(); dry.gain.value = 0.85;
    var wet = ctx.createGain(); wet.gain.value = 0.28;
    var rev = makeReverb();
    master.connect(dry); dry.connect(comp);
    master.connect(rev); rev.connect(wet); wet.connect(comp);
    droneGain = ctx.createGain(); droneGain.gain.value = 0; droneGain.connect(master);
    var n = 20, re = new Float32Array(n), im = new Float32Array(n);
    var amps = [0,1,0.56,0.40,0.29,0.21,0.16,0.115,0.085,0.062,0.046,0.034,0.026,0.02,0.015,0.012,0.009,0.007,0.0055,0.0045];
    for(var i = 1; i < n; i++) im[i] = amps[i];
    PW = ctx.createPeriodicWave(re, im);
    var nl = Math.floor(ctx.sampleRate * 0.05); NOISE = ctx.createBuffer(1, nl, ctx.sampleRate);
    var nd = NOISE.getChannelData(0); for(var k = 0; k < nl; k++) nd[k] = Math.random() * 2 - 1;
  }
  if(ctx.state === "suspended") ctx.resume();
  return ctx;
}

/* One piano note. Returns its envelope so a following note can damp it. */
function piano(freq, t, o){
  o = o || {};
  var dest = o.dest || bus || master, vel = o.gain || 0.5;
  var hold = (o.hold || 7) * Math.pow(261.63 / freq, 0.35);
  var env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(vel, t + 0.004);
  env.gain.setTargetAtTime(vel * 0.5, t + 0.004, 0.1);
  env.gain.setTargetAtTime(0.0001, t + 0.25, hold / 4.5);
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.4;
  lp.frequency.setValueAtTime(Math.min(freq * 16, 12000), t);
  lp.frequency.setTargetAtTime(Math.max(freq * 2.4, 420), t + 0.01, hold / 3.2);
  var a = ctx.createOscillator(), b = ctx.createOscillator(), s = ctx.createOscillator();
  a.setPeriodicWave(PW); b.setPeriodicWave(PW); s.type = "sine";
  a.frequency.value = freq; b.frequency.value = freq; s.frequency.value = freq;
  a.detune.value = -1.8; b.detune.value = 2.2;
  var gab = ctx.createGain(); gab.gain.value = 0.32;
  var gs = ctx.createGain(); gs.gain.value = 0.28;
  a.connect(gab); b.connect(gab); gab.connect(lp); s.connect(gs); gs.connect(lp);
  lp.connect(env); env.connect(dest);
  var nb = ctx.createBufferSource(); nb.buffer = NOISE;
  var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = Math.min(freq * 5, 6000); bp.Q.value = 1.2;
  var ng = ctx.createGain(); ng.gain.setValueAtTime(vel * 0.22, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  nb.connect(bp); bp.connect(ng); ng.connect(dest);
  var end = t + hold + 1.5;
  a.start(t); b.start(t); s.start(t); nb.start(t);
  a.stop(end); b.stop(end); s.stop(end);
  return env;
}

function stopAll(){
  if(bus && ctx){
    var old = bus;
    old.gain.setTargetAtTime(0, ctx.currentTime, 0.06);
    setTimeout(function(){ try{ old.disconnect(); }catch(e){} }, 700);
  }
  bus = null;
}

/* seq: array of {id, dur, rest}. damp = soften each note as the next begins (like a half pedal). */
function playSeq(seq, damp){
  if(!audio()) return 0;
  stopAll();
  bus = ctx.createGain(); bus.gain.value = 1; bus.connect(master);
  var t = ctx.currentTime + 0.08, base = sa(), prev = null, lastOnset = t;
  seq.forEach(function(n){
    if(n.id){
      if(damp && prev) prev.gain.setTargetAtTime(0.0001, t + 0.06, 0.4);
      prev = piano(base * SW[n.id].r, t, {gain: n.soft ? 0.38 : 0.5});
      lastOnset = t;
    }
    t += n.dur + (n.rest || 0);
  });
  return (lastOnset - ctx.currentTime) * 1000 + 1400;
}

function droneTick(){
  var base = sa(), pattern = [0.75, 1, 1, 0.5];
  while(droneNext < ctx.currentTime + 0.4){
    piano(base * pattern[droneStep % 4], droneNext, {gain:0.2, dest:droneGain, hold:9});
    droneNext += 0.95; droneStep++;
  }
}
function setDrone(on){
  if(!audio()) return;
  droneOn = on;
  var now = ctx.currentTime;
  droneGain.gain.cancelScheduledValues(now);
  droneGain.gain.setValueAtTime(droneGain.gain.value, now);
  droneGain.gain.linearRampToValueAtTime(on ? 1 : 0, now + (on ? 0.3 : 0.6));
  if(on){
    droneNext = now + 0.05; droneStep = 0;
    clearInterval(droneTimer); droneTimer = setInterval(droneTick, 100); droneTick();
  } else {
    setTimeout(function(){ if(!droneOn){ clearInterval(droneTimer); droneTimer = null; } }, 700);
  }
  var b = document.getElementById("drone");
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.querySelector("span").textContent = on ? "Drone on" : "Drone off";
}

/* ---------- Helpers ---------- */
function rand(n){ return Math.floor(Math.random() * n); }
function pick(a){ return a[rand(a.length)]; }
function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = rand(i + 1), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function store(){ try{ return JSON.parse(localStorage.getItem("swara-sense-best") || "{}"); }catch(e){ return {}; } }
function save(obj){ try{ localStorage.setItem("swara-sense-best", JSON.stringify(obj)); }catch(e){} }

/* ---------- Keyboard ---------- */
var neck = document.getElementById("keys");
var WHITES = ["S","R2","G3","M1","P","D2","N3","S2"];
var BLACKS = [["R1",1],["G2",2],["M2",4],["D1",5],["N2",6]];
function keyBtn(id, cls){
  var b = el("button", "key " + cls);
  b.dataset.id = id;
  b.setAttribute("aria-label", "Play " + label(id) + ", " + SW[id].name);
  b.innerHTML = '<span class="t">' + SW[id].ta + '</span><span class="l">' + label(id) + '</span>';
  b.addEventListener("click", function(){
    if(!audio()) return;
    piano(sa() * SW[id].r, ctx.currentTime + 0.02, {dest:master, gain:0.5});
    b.classList.add("flash");
    setTimeout(function(){ b.classList.remove("flash"); }, 420);
  });
  return b;
}
WHITES.forEach(function(id){ neck.appendChild(keyBtn(id, "white")); });
BLACKS.forEach(function(p){
  var b = keyBtn(p[0], "black");
  b.style.left = "calc(8px + (100% - 16px) * " + (p[1] / 8) + " - (100% - 16px) * 0.045)";
  neck.appendChild(b);
});
function light(ids){
  [].forEach.call(neck.querySelectorAll(".key"), function(f){ f.classList.toggle("lit", ids.indexOf(f.dataset.id) > -1); });
}

/* ---------- Game state ---------- */
var state = {mode:"swara", level:"beginner", i:0, correct:0, score:0, streak:0, bestStreak:0, results:[], q:null, played:false, answered:false, busy:false, last:null};
var stage = document.getElementById("stage");

function ragaPool(){ return state.level === "beginner" ? RAGAS.filter(function(r){ return r.b; }) : RAGAS; }

function makeQuestion(){
  var lvl = state.level, q = {};
  if(state.mode === "swara"){
    var pool = lvl === "beginner" ? ["R2","G3","M1","P","D2","N3"] : ["R1","R2","G2","G3","M1","M2","P","D1","D2","N2","N3"];
    var ans; do { ans = pick(pool); } while(ans === state.last && pool.length > 1);
    q.answer = ans;
    q.options = pool.map(function(id){ return {key:id, title:id, sub:SW[id].name}; });
    q.prompt = "You'll hear Sa, then a second swara. Which one is it?";
    q.seq = [{id:"S", dur:1.1, rest:0.15, soft:true}, {id:ans, dur:1.6}];
    q.damp = false;
    q.reveal = ["S", ans];
    q.explain = "<b>" + ans + ", " + SW[ans].name + "</b>: " + SW[ans].desc;
  }
  else if(state.mode === "raga"){
    var rp = ragaPool(), r;
    do { r = pick(rp); } while(r.n === state.last && rp.length > 1);
    var others = shuffle(rp.filter(function(x){ return x !== r; })).slice(0, 3);
    q.answer = r.n; q.raga = r;
    q.options = shuffle(others.concat([r])).map(function(x){ return {key:x.n, title:x.n, sub:x.s.length === 5 ? "Five notes" : "Seven notes"}; });
    q.prompt = "Listen to the scale going up and coming back down. Which raga is it?";
    var up = r.s.concat(["S2"]), down = up.slice().reverse().slice(1);
    q.seq = up.concat(down).map(function(id, k, arr){ return {id:id, dur: k === up.length - 1 ? 0.75 : 0.42, rest: k === up.length - 1 ? 0.1 : 0.02}; });
    q.reveal = up;
    q.damp = true;
    q.explain = "<b>" + r.n + "</b> (" + r.s.join(" ") + "): " + r.d;
  }
  else {
    var scaleR = lvl === "beginner" ? RAGAS[1] : pick(RAGAS);
    var deg = scaleR.s.concat(["S2"]), n = lvl === "beginner" ? 4 : 6;
    var pos = rand(3), phrase = [];
    for(var k = 0; k < n; k++){
      phrase.push(pos);
      var step = pick([-2,-1,-1,1,1,2]);
      pos = Math.min(deg.length - 1, Math.max(0, pos + step));
    }
    var ci = rand(n), old = phrase[ci], nu;
    do { nu = Math.min(deg.length - 1, Math.max(0, old + pick([-2,-1,1,2]))); } while(nu === old);
    var changed = phrase.slice(); changed[ci] = nu;
    var a = phrase.map(function(p){ return deg[p]; }), b = changed.map(function(p){ return deg[p]; });
    q.answer = "n" + ci;
    q.options = phrase.map(function(_, k){ return {key:"n" + k, title:"Note " + (k + 1), sub:""}; });
    q.prompt = "You'll hear a short phrase twice. One note changes the second time. Which one?";
    var seqA = a.map(function(id){ return {id:id, dur:0.46, rest:0.04}; });
    var seqB = b.map(function(id){ return {id:id, dur:0.46, rest:0.04}; });
    seqA[seqA.length - 1].rest = 1.1;
    q.damp = true;
    q.seq = seqA.concat(seqB);
    q.reveal = [a[ci], b[ci]];
    var dir = nu > old ? "up" : "down";
    q.explain = "<b>Note " + (ci + 1) + "</b> moved " + dir + " from " + label(a[ci]) + " to " + label(b[ci]) + ". The phrases were " + a.map(label).join(" ") + ", then " + b.map(label).join(" ") + (lvl === "advanced" ? ", in " + scaleR.n + "." : ".");
  }
  state.last = q.answer;
  return q;
}

/* ---------- Rendering ---------- */
var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
var ICON_REPLAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';

function updateStats(){
  document.getElementById("score").textContent = state.score;
  document.getElementById("streak").textContent = state.streak;
}

function progressBar(){
  var p = el("div", "progress");
  for(var k = 0; k < ROUND; k++){
    var t = el("i");
    if(k < state.results.length) t.className = state.results[k] ? "ok" : "no";
    else if(k === state.i) t.className = "now";
    p.appendChild(t);
  }
  return p;
}

function renderQuestion(){
  var q = state.q;
  stage.innerHTML = "";
  stage.appendChild(progressBar());
  stage.appendChild(el("p", "qcount", "Question " + (state.i + 1) + " of " + ROUND));
  stage.appendChild(el("p", "prompt", q.prompt));

  var row = el("div", "playrow");
  var play = el("button", "play", ICON_PLAY);
  play.id = "playBtn"; play.setAttribute("aria-label", "Play the question");
  play.addEventListener("click", doPlay);
  row.appendChild(play);
  var lis = el("div", "listen", "<span></span><span></span><span></span><span></span>");
  lis.id = "listen"; row.appendChild(lis);
  if(state.mode === "raga"){
    var ph = el("button", "ghost", "Hear a phrase");
    ph.addEventListener("click", playPhrase);
    row.appendChild(ph);
  }
  var hint = el("span", "playhint", "Tap to listen");
  hint.id = "playhint"; row.appendChild(hint);
  stage.appendChild(row);

  var opts = el("div", "options");
  q.options.forEach(function(o){
    var b = el("button", "opt", "<b>" + o.title + "</b>" + (o.sub ? "<small>" + o.sub + "</small>" : ""));
    b.dataset.key = o.key; b.disabled = true; b.classList.add("locked");
    b.addEventListener("click", function(){ answer(o.key); });
    opts.appendChild(b);
  });
  opts.id = "opts";
  stage.appendChild(opts);
  light([]);
}

function setListening(on, ms){
  var l = document.getElementById("listen");
  if(!l) return;
  l.classList.toggle("on", on);
  if(on){ state.busy = true; setTimeout(function(){ state.busy = false; var x = document.getElementById("listen"); if(x) x.classList.remove("on"); }, ms); }
}

function doPlay(){
  if(!state.q) return;
  var ms = playSeq(state.q.seq, state.q.damp);
  setListening(true, ms);
  if(!state.played){
    state.played = true;
    var pb = document.getElementById("playBtn");
    pb.innerHTML = ICON_REPLAY; pb.classList.add("replay"); pb.setAttribute("aria-label", "Replay the question");
    var h = document.getElementById("playhint"); if(h) h.textContent = "Replay as often as you like";
    if(!state.answered){
      [].forEach.call(document.querySelectorAll("#opts .opt"), function(b){ b.disabled = false; b.classList.remove("locked"); });
    }
  }
}

function playPhrase(){
  var r = state.q.raga, deg = r.s.concat(["S2"]), pos = 0, seq = [];
  for(var k = 0; k < 9; k++){
    seq.push({id:deg[pos], dur: k === 8 ? 0.8 : pick([0.32,0.32,0.5]), rest:0.02});
    pos = Math.min(deg.length - 1, Math.max(0, pos + pick([-1,1,1,2,-2])));
  }
  seq.push({id:"S", dur:1.2});
  var ms = playSeq(seq, true);
  setListening(true, ms);
}

function answer(key){
  if(state.answered || !state.played) return;
  state.answered = true;
  var q = state.q, ok = key === q.answer;
  state.results.push(ok);
  var gained = 0;
  if(ok){
    state.correct++; state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    gained = 10 + Math.min(state.streak - 1, 5) * 2;
    state.score += gained;
  } else {
    state.streak = 0;
  }
  updateStats();
  [].forEach.call(document.querySelectorAll("#opts .opt"), function(b){
    b.disabled = true;
    if(b.dataset.key === q.answer) b.classList.add("correct");
    else if(b.dataset.key === key) b.classList.add("wrong");
    else b.classList.add("locked");
  });
  light(q.reveal);
  var pr = stage.querySelector(".progress"); stage.replaceChild(progressBar(), pr);

  var fb = el("div", "feedback");
  var chosen = q.options.filter(function(o){ return o.key === key; })[0];
  var verdict = ok
    ? '<span class="verdict ok">Correct, +' + gained + '.</span> '
    : '<span class="verdict no">Not quite. You picked ' + chosen.title + '.</span> ';
  fb.appendChild(el("p", null, verdict + q.explain));
  var nx = el("button", "primary", state.i === ROUND - 1 ? "See results" : "Next question");
  nx.id = "nextBtn";
  nx.addEventListener("click", next);
  fb.appendChild(nx);
  stage.appendChild(fb);
  nx.focus({preventScroll:true});
}

function next(){
  if(!state.answered) return;
  state.i++;
  if(state.i >= ROUND) return renderDone();
  newQuestion();
}

function newQuestion(){
  state.q = makeQuestion(); state.played = false; state.answered = false;
  renderQuestion();
}

function renderDone(){
  stopAll();
  state.q = null;
  var bests = store(), key = state.mode + ":" + state.level, prev = bests[key] || 0, isBest = state.score > prev;
  if(isBest){ bests[key] = state.score; save(bests); }
  stage.innerHTML = "";
  stage.appendChild(progressBar());
  var d = el("div", "done");
  var line = state.correct >= 9 ? "Sharp ears." : state.correct >= 6 ? "Well heard." : state.correct >= 3 ? "Getting there." : "Keep listening.";
  d.appendChild(el("h2", null, line));
  d.appendChild(el("p", null, state.correct + " of " + ROUND + " correct, " + state.score + " points, best streak " + state.bestStreak + "."));
  d.appendChild(el("p", null, isBest ? "That's your best score in " + MODE_NAMES[state.mode] + " (" + state.level + ")." : "Your best in " + MODE_NAMES[state.mode] + " (" + state.level + ") is " + prev + "."));
  var row = el("div", "row");
  var again = el("button", "primary", "Play again");
  again.addEventListener("click", startRound);
  var share = el("button", "ghost", "Copy my result");
  share.addEventListener("click", function(){
    var text = "I scored " + state.score + " on Swara Sense (" + MODE_NAMES[state.mode] + ", " + state.level + "): " + state.correct + "/" + ROUND + " correct, best streak " + state.bestStreak + ". Can you beat it?";
    copy(text, share);
  });
  row.appendChild(again); row.appendChild(share);
  d.appendChild(row);
  stage.appendChild(d);
  again.focus({preventScroll:true});
}

function copy(text, btn){
  function done(){ btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = "Copy my result"; }, 1800); }
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ btn.textContent = "Copy failed"; }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
}

function startRound(){
  stopAll();
  state.i = 0; state.correct = 0; state.score = 0; state.streak = 0; state.bestStreak = 0; state.results = []; state.last = null;
  updateStats();
  newQuestion();
}

/* ---------- Controls ---------- */
[].forEach.call(document.querySelectorAll(".modes button"), function(b){
  b.addEventListener("click", function(){
    state.mode = b.dataset.mode;
    [].forEach.call(document.querySelectorAll(".modes button"), function(x){ x.setAttribute("aria-selected", x === b ? "true" : "false"); });
    startRound();
  });
});
[].forEach.call(document.querySelectorAll(".level button"), function(b){
  b.addEventListener("click", function(){
    state.level = b.dataset.level;
    [].forEach.call(document.querySelectorAll(".level button"), function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    startRound();
  });
});
var sel = document.getElementById("sruti");
SRUTIS.forEach(function(s){ var o = el("option", null, s[0]); o.value = s[1]; if(s[1] === 1) o.selected = true; sel.appendChild(o); });
sel.addEventListener("change", function(){
  sruti = parseInt(sel.value, 10);
  if(droneOn){ setDrone(false); setTimeout(function(){ setDrone(true); }, 300); }
});
document.getElementById("drone").addEventListener("click", function(){ setDrone(!droneOn); });
document.getElementById("restart").addEventListener("click", startRound);

document.addEventListener("keydown", function(e){
  var tag = (e.target && e.target.tagName) || "";
  if(tag === "SELECT" || tag === "TEXTAREA") return;
  if(e.code === "Space" && state.q){
    if(tag === "BUTTON" && e.target.id !== "playBtn") return;
    e.preventDefault(); doPlay();
  } else if(e.key === "Enter" && state.answered && state.q && tag !== "BUTTON"){
    next();
  }
});

startRound();
})();
</script>
